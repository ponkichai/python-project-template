[project]
name = "my-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
    "pip-audit>=2.10.0",
    "pyyaml>=6.0",
]

# --- Ruff ---
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle（スタイル）
    "F",    # pyflakes（未使用変数・import）
    "I",    # isort（import順）
    "UP",   # pyupgrade（古い書き方）
    "B",    # flake8-bugbear（実バグになりやすいパターン）
    "C4",   # flake8-comprehensions（内包表記の簡潔化）
    "SIM",  # flake8-simplify（冗長なコードの簡略化）
    "RUF",  # Ruff固有ルール
]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
